name: Smoke Tests

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Start Nimbus
        working-directory: infra
        run: make start

      - name: Provision resources
        working-directory: infra
        run: make apply

      - name: Run smoke tests
        working-directory: infra
        run: make smoke-test

      - name: Stop Nimbus
        if: always()
        working-directory: infra
        run: make stop
